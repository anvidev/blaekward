version: "3.9"

services:
  blaekward:
    build: .
    container_name: blaekward
    ports:
      - "9090:9090"  # API server
      - "9091:9091"  # Socket server
    networks:
      - blaek-net
    environment:
      - APP_ENV=production

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - blaek-net
    restart: unless-stopped

networks:
  blaek-net:
    driver: bridge
